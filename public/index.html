<!DOCTYPE html>
<html>

<head>
    <title>Student Attendance</title>

    <style>
        body {
            font-family: Arial;
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
        }
    </style>

</head>

<body>

    <h1>Student Attendance</h1>

    <input
        type="number"
        id="rollNo"
        placeholder="Enter Roll No"
    >

    <button onclick="markAttendance()">
        Mark Attendance
    </button>

    <div id="result"></div>


    <script>

        async function markAttendance() {

            const rollNo =
                document.getElementById("rollNo").value;

            if (!rollNo) {
                alert("Please enter Roll No");
                return;
            }


            // GET request with parameter
            const response = await fetch(
                `/api/attendance/${rollNo}`
            );


            const data = await response.json();


            const result =
                document.getElementById("result");


            if (data.success) {

                result.innerHTML = `

                    <h2>${data.message}</h2>

                    <p>
                        <b>Roll No:</b>
                        ${data.student.rollNo}
                    </p>

                    <p>
                        <b>Name:</b>
                        ${data.student.name}
                    </p>

                    <p>
                        <b>Enrollment No:</b>
                        ${data.student.enrollmentNo}
                    </p>

                `;

            } else {

                result.innerHTML = `

                    <h2>${data.message}</h2>

                `;
            }

        }

    </script>

</body>

</html>
